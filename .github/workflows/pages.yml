# Publica a página do jogo (aparelho.html + o jogo) no GitHub Pages a cada envio para a branch main (doc 15).
# Só roda se o Pages estiver ligado no repositório (Settings > Pages > Source: GitHub Actions).
# O que vai para o site é decidido por sim/tools/montar-site.mjs (nada do jogo salvo, servidor ou testes).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # também dá para rodar à mão na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar os testes
        working-directory: sim
        run: node --test

  publicar:
    needs: testar # só publica se todos os testes passarem
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o site
        run: node sim/tools/montar-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
