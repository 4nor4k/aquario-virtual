<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquário · simulador</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <section class="aparelho">
      <!-- Janela do jogo: 120×120 pixels de render, mostrada em 240×240 (escala 2×) -->
      <canvas id="tela" width="120" height="120"></canvas>
    </section>

    <aside class="painel" id="painel">
      <h1>Aquário · simulador</h1>
      <p class="versao">v0.2 · passo 2</p>

      <section>
        <h2>Tempo</h2>
        <div class="botoes" id="velocidades">
          <button data-vel="1">1×</button>
          <button data-vel="60">60×</button>
          <button data-vel="3600">3600×</button>
        </div>
        <p id="hora-jogo" class="destaque"></p>
        <div class="botoes">
          <button id="pular">Pular fase</button>
          <button id="reiniciar">Reiniciar</button>
        </div>
      </section>

      <section>
        <h2>Peixe</h2>
        <p id="peixe"></p>
        <p id="aviso-vida" class="aviso" hidden></p>
      </section>

      <section>
        <h2>Câmera</h2>
        <p class="dica">Setas ou WASD</p>
        <p id="camera"></p>
      </section>

      <section>
        <h2>Tela</h2>
        <button id="tamanho"></button>
      </section>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
